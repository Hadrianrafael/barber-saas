name: Deploy

# Build → push to ACR → run migrations → roll Container Apps.
# Staging deploys automatically on green main; production is manual and gated by
# the `production` GitHub Environment (required reviewers). Nothing here is
# destructive — migrations are `prisma migrate deploy` (forward-only) and the
# apps are updated with a new image tag (revision), never deleted.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC federated login to Azure

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: ACR build (web + worker share one image)
        run: |
          az acr build \
            --registry "${{ secrets.ACR_NAME }}" \
            --image "barber-saas:${{ steps.meta.outputs.tag }}" \
            --image "barber-saas:latest" \
            --file Dockerfile .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    env:
      ENV_NAME: ${{ github.event.inputs.environment || 'staging' }}
      IMAGE: ${{ secrets.ACR_NAME }}.azurecr.io/barber-saas:${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Migrations run once, before any app picks up the new image.
      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}

      - name: Update web Container App
        run: |
          az containerapp update \
            --name "barber-${ENV_NAME}-web" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --image "$IMAGE"

      - name: Update worker Container App
        run: |
          az containerapp update \
            --name "barber-${ENV_NAME}-worker" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --image "$IMAGE"

      - name: Update scheduled jobs (reminders + message retry)
        run: |
          for job in reminders retry-messages; do
            az containerapp job update \
              --name "barber-${ENV_NAME}-cron-${job}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --image "$IMAGE" || echo "job barber-${ENV_NAME}-cron-${job} not found, skipping"
          done

      - name: Smoke check readiness
        run: |
          sleep 20
          curl -fsS "${{ secrets.APP_HEALTH_URL }}" | tee /dev/stderr | grep -q '"status":"healthy"'
