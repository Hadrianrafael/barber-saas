name: Deploy

# Build → push to ACR → run migrations (inside the Container Apps env) → roll the
# web + worker apps and the scheduled jobs.
#
# - staging deploys automatically on green `main`.
# - production is `workflow_dispatch` only, gated by the `production` GitHub
#   Environment (required reviewers).
# - Nothing is destructive: `prisma migrate deploy` is forward-only; apps are
#   updated with a new image tag (a new revision), never deleted. Rollback =
#   re-run with an older commit SHA, or `az containerapp revision set-active`.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC federated login to Azure

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: ACR build (one image runs web + worker + jobs)
        run: |
          az acr build \
            --registry "${{ secrets.ACR_NAME }}" \
            --image "barber-saas:${{ steps.meta.outputs.tag }}" \
            --image "barber-saas:latest" \
            --file Dockerfile .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    env:
      # GitHub Environment name → Bicep `environment` short name (dev|staging|prod)
      ENV_SHORT: ${{ (github.event.inputs.environment || 'staging') == 'production' && 'prod' || 'staging' }}
      IMAGE: ${{ secrets.ACR_NAME }}.azurecr.io/barber-saas:${{ needs.build.outputs.tag }}
      RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
      PREFIX: barber
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Migrations run inside the Container Apps env (which can reach the DB),
      # once, before any app picks up the new image. Forward-only.
      - name: Run database migrations
        run: |
          set -euo pipefail
          JOB="$PREFIX-$ENV_SHORT-migrate"
          az containerapp job update -g "$RG" -n "$JOB" --image "$IMAGE" --output none
          EXEC=$(az containerapp job start -g "$RG" -n "$JOB" --query name -o tsv)
          echo "started execution: $EXEC"
          for i in $(seq 1 40); do
            status=$(az containerapp job execution show -g "$RG" -n "$JOB" --job-execution-name "$EXEC" \
              --query "properties.status" -o tsv 2>/dev/null || echo "Unknown")
            echo "migrate job: $status"
            [ "$status" = "Succeeded" ] && break
            [ "$status" = "Failed" ] && { echo "::error::migration job failed"; exit 1; }
            [ "$i" = "40" ] && { echo "::error::migration job timed out"; exit 1; }
            sleep 15
          done

      - name: Roll web + worker
        run: |
          az containerapp update -g "$RG" -n "$PREFIX-$ENV_SHORT-web"    --image "$IMAGE" --output none
          az containerapp update -g "$RG" -n "$PREFIX-$ENV_SHORT-worker" --image "$IMAGE" --output none

      - name: Roll scheduled jobs
        run: |
          for job in cron-reminders cron-retry; do
            az containerapp job update -g "$RG" -n "$PREFIX-$ENV_SHORT-$job" --image "$IMAGE" --output none \
              || echo "job $PREFIX-$ENV_SHORT-$job not found, skipping"
          done

      - name: Smoke check readiness
        run: |
          sleep 25
          curl -fsS "${{ secrets.APP_HEALTH_URL }}" | tee /dev/stderr | grep -q '"status":"healthy"'
